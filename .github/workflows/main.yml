
name: Build UM APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          mkdir -p project
          unzip -o UM-Mobile-APK.zip -d project

          PACKAGE_JSON=$(find project -name package.json -not -path '*/node_modules/*' -print -quit)

          if [ -z "$PACKAGE_JSON" ]; then
            echo "package.json not found in ZIP"
            exit 1
          fi

          echo "PROJECT_DIR=$(dirname "$PACKAGE_JSON")" >> $GITHUB_ENV

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: latest
          accept-android-sdk-licenses: true
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Install dependencies
        run: |
          cd "$PROJECT_DIR"
          npm install

      - name: Prepare Android
        run: |
          cd "$PROJECT_DIR"

          if [ ! -d android ]; then
            npx cap add android
          fi

          npx cap sync android

      - name: Build APK
        run: |
          cd "$PROJECT_DIR/android"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: UM-APK
          path: "**/android/app/build/outputs/apk/debug/app-debug.apk"
          if-no-files-found: error
          
